name: RoomBook regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn --batch-mode verify
      - name: Book a room using the packaged JAR
        working-directory: ${{ runner.temp }}
        run: |
          java -jar "$GITHUB_WORKSPACE/target/roombook-2.0.0.jar" 18080 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 3 http://127.0.0.1:18080/api/rooms >/dev/null
          python3 "$GITHUB_WORKSPACE/demo-booking.py" --port 18080

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: roombook_test
          MYSQL_USER: roombook
          MYSQL_PASSWORD: roombook-ci-password
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: platform/pom.xml
      - run: mvn --batch-mode -f platform/pom.xml verify
        env:
          ROOMBOOK_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/roombook_test
          ROOMBOOK_MYSQL_USER: roombook
          ROOMBOOK_MYSQL_PASSWORD: roombook-ci-password
