spring.application.name=roombook
server.address=127.0.0.1
server.port=${ROOMBOOK_PORT:8080}

spring.datasource.url=${ROOMBOOK_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/roombook}
spring.datasource.username=${ROOMBOOK_MYSQL_USER:roombook}
spring.datasource.password=${ROOMBOOK_MYSQL_PASSWORD:}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.mvc.formcontent.filter.enabled=false
spring.task.scheduling.pool.size=2
